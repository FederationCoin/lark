plugins {
    id 'java-library'
    id 'org.gradlex.extra-java-module-info' version '1.13.1'
}

group = 'com.sparrowwallet'
version = '1.1.0'

repositories {
    mavenCentral()
    // maven { url = uri('https://maven.federationcoin.org') } // not yet provisioned
    // maven { url = uri('https://code.sparrowwallet.com/api/packages/sparrowwallet/maven') }
}

tasks.withType(AbstractArchiveTask) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

java {
    withSourcesJar()
}

dependencies {
    implementation(project(':drongo'))
    // Sparrow Gitea hid4java/usb4java are not yet mirrored at maven.federationcoin.org.
    // implementation('com.sparrowwallet:hid4java:0.8.1')
    // implementation('com.sparrowwallet:usb4java:1.3.6')
    implementation('org.hid4java:hid4java:0.8.0')
    implementation('com.fazecast:jSerialComm:2.11.4')
    implementation('org.usb4java:usb4java:1.3.0')
    implementation('co.nstant.in:cbor:0.9')
    implementation('com.fasterxml.jackson.core:jackson-databind:2.21.1')
    implementation('org.apache.commons:commons-lang3:3.20.0')
    implementation('com.google.protobuf:protobuf-java:4.34.0')
    implementation('commons-codec:commons-codec:1.21.0')
    implementation('org.slf4j:slf4j-api:2.0.17')
    implementation('com.sparrowwallet:tern:1.0.6')
    implementation('io.reactivex.rxjava2:rxjava:2.2.21')
    implementation('org.jetbrains:annotations:26.0.2')
    testImplementation('org.junit.jupiter:junit-jupiter-api:5.14.1')
    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.14.1')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

test {
    useJUnitPlatform()
    jvmArgs = ["--enable-native-access=ALL-UNNAMED"]
}

extraJavaModuleInfo {
    module('co.nstant.in:cbor', 'co.nstant.in.cbor') {
        exports('co.nstant.in.cbor')
        exports('co.nstant.in.cbor.model')
        exports('co.nstant.in.cbor.builder')
    }
    module('org.hid4java:hid4java', 'org.hid4java') {
        requires('com.sun.jna')
        exports('org.hid4java')
        exports('org.hid4java.jna')
    }
    module('org.usb4java:usb4java', 'org.usb4java') {
        exports('org.usb4java')
    }
    // Maven Central usb4java ships one native jar per OS; they are not JPMS modules.
    // Unique names: all seven sit on the classpath from the usb4java POM.
    automaticModule('libusb4java-1.3.0-linux-x86.jar', 'org.usb4java.libusb4java.linux.x86')
    automaticModule('libusb4java-1.3.0-linux-x86-64.jar', 'org.usb4java.libusb4java.linux.x86_64')
    automaticModule('libusb4java-1.3.0-linux-arm.jar', 'org.usb4java.libusb4java.linux.arm')
    automaticModule('libusb4java-1.3.0-linux-aarch64.jar', 'org.usb4java.libusb4java.linux.aarch64')
    automaticModule('libusb4java-1.3.0-win32-x86.jar', 'org.usb4java.libusb4java.win32.x86')
    automaticModule('libusb4java-1.3.0-win32-x86-64.jar', 'org.usb4java.libusb4java.win32.x86_64')
    automaticModule('libusb4java-1.3.0-darwin-x86-64.jar', 'org.usb4java.libusb4java.darwin.x86_64')
    module('com.google.code.findbugs:jsr305', 'com.google.code.findbugs.jsr305')
}
//Prints the test runtime classpath, so a harness can be launched with plain java the way the
//end to end drivers do rather than through Gradle.
tasks.register('printTestClasspath') {
    doLast {
        println sourceSets.test.runtimeClasspath.asPath
    }
}
